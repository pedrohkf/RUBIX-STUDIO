[workspace]
resolver = "3"
members = ["crates/dom", "crates/rojo-client", "crates/lua", "crates/app"]
# crates/lua (mlua/Luau) e crates/app (Bevy) entram depois: compilação pesada, ficam separados.

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
rbx_dom_weak = "4.2.0"
rbx_types = { version = "3.1.0", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
rmp-serde = "1.3.1"
thiserror = "2"

# Nos crates de execução do jogo, nada pode derrubar o processo (docs/bug-prevention.md).
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"

# Bevy fica lento demais sem otimização; nosso código em opt 1, dependências em opt 3.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
